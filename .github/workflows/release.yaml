# Bauen und schieben auf einen Tag hin.
#
# Vorher lief das von Hand, und es hat zweimal gekostet:
#
#   `docker build` ohne `--platform` nimmt die Architektur des eigenen
#   Rechners. Der App-Host ist x86_64, der Entwicklungsrechner arm64. Am
#   2026-11-24 lief `0.3.6` so in einen Neustartkreis - `exec format error`,
#   und nichts davor warnt. Hier baut ein amd64-Runner, und der Workflow
#   prueft die Architektur hinterher trotzdem nach.
#
#   Zwei Sitzungen waehlten dieselbe Versionsnummer. Git lehnt einen Push ab,
#   der etwas verlieren wuerde - die Registry nicht, sie nimmt ihn
#   stillschweigend an. Hier ist der Tag die einzige Quelle, und ein
#   vergebener Tag laesst den Lauf scheitern, bevor etwas hochgeladen wird.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Die Fassung in package.json muss der Tag sein
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag, package.json $pkg - das ist nicht dasselbe" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
        id: version

      # Kein Bild aus einem roten Baum.
      - run: npm ci
      - run: npm test

      - name: Der Tag darf nicht vergeben sein
        run: |
          img="ghcr.io/${{ github.repository_owner }}/provider-cluster:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "$img liegt schon in der Registry - ein Tag wird nicht ueberschrieben" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/provider-cluster:${{ steps.version.outputs.version }}

      - name: Nachsehen, nicht annehmen
        run: |
          img="ghcr.io/${{ github.repository_owner }}/provider-cluster:${{ steps.version.outputs.version }}"

          # Die Architektur ausdruecklich. `docker manifest inspect` ohne `-v`
          # zeigt sie nicht, und ein arm64-Bild auf diesem Host ist ein
          # Ausfall ohne Vorwarnung.
          docker buildx imagetools inspect "$img" | grep -q 'linux/amd64'

          # Und der Dienst muss sich laden lassen. Ein Bild, dem ein Modul
          # fehlt, startet erst im Betrieb nicht - diese Zeile faengt es hier.
          docker run --rm --entrypoint node "$img" -e "
            const h = require('/app/provider/cluster/handlers');
            const k = require('/app/provider/cluster/k0rdent');
            for (const name of ['provision','update','metrics','deprovision']) {
              if (typeof h[name] !== 'function') throw new Error('fehlt: ' + name);
            }
            if (typeof k.versionPatch !== 'function') throw new Error('fehlt: versionPatch');
            console.log('Handler geladen, Uebersetzer geladen');
          "
